<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Admin</title>
  <style>
    :root {
      --bg:       #141414;
      --surface:  #1e1e1e;
      --surface2: #252525;
      --border:   #2e2e2e;
      --text:     #e0e0e0;
      --muted:    #666;
      --accent:   #4a9eff;
      --danger:   #e05555;
      --success:  #4aab6e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .header h1 { font-size: 0.95rem; font-weight: 600; letter-spacing: 0.02em; }
    .header-sub { font-size: 0.75rem; color: var(--muted); margin-left: 0.75rem; }
    .header-actions { display: flex; gap: 0.6rem; align-items: center; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 13px; border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2); color: var(--text);
      cursor: pointer; font-size: 13px; font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: #2e2e2e; border-color: #3a3a3a; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
    .btn-primary:hover { background: #3a8eef; border-color: #3a8eef; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-icon { padding: 4px 8px; min-width: 28px; justify-content: center; font-size: 13px; }
    .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
    .btn-ghost:hover { background: rgba(255,255,255,0.05); border-color: transparent; color: var(--text); }
    .btn-danger-ghost { background: transparent; border-color: transparent; color: var(--muted); }
    .btn-danger-ghost:hover { background: rgba(224,85,85,0.1); border-color: transparent; color: var(--danger); }

    /* ── Layout ── */
    .main {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ── Section ── */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .section-header {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .section-title {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .count-badge {
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      font-size: 11px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 1px 8px;
      color: var(--muted);
    }
    .section-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* ── Fields ── */
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .field input, .field select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
      width: 100%;
      transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
    .field input::placeholder { color: #444; }

    /* ── Project grid ── */
    .project-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      padding: 1.25rem;
    }

    /* ── Project card ── */
    .project-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .project-card.editing {
      grid-column: 1 / -1;
      flex-direction: row;
      align-items: stretch;
    }

    /* Thumbnail */
    .card-thumb {
      aspect-ratio: 4 / 3;
      background: var(--border);
      background-size: cover;
      background-position: center;
      position: relative;
      flex-shrink: 0;
    }
    .project-card.editing .card-thumb {
      aspect-ratio: unset;
      width: 220px;
      border-right: 1px solid var(--border);
    }
    .card-thumb-tag {
      position: absolute;
      top: 0.5rem;
      left: 0.5rem;
    }
    .card-thumb-actions {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      display: flex;
      gap: 1px;
      opacity: 0;
      transition: opacity 0.15s;
      background: rgba(20,20,20,0.7);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 2px;
    }
    .project-card:hover .card-thumb-actions { opacity: 1; }

    /* Caption (collapsed) */
    .card-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.75rem;
      gap: 0.5rem;
      border-top: 1px solid var(--border);
    }
    .project-card.editing .card-caption { display: none; }
    .card-name {
      font-size: 12px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    /* Edit panel */
    .card-edit { display: none; flex-direction: column; flex: 1; min-width: 0; }
    .project-card.editing .card-edit { display: flex; }
    .card-edit-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.9rem;
      border-bottom: 1px solid var(--border);
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .card-edit-header .card-name { font-size: 13px; }
    .card-edit-body {
      padding: 0.9rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
    }
    .card-edit-body .full { grid-column: 1 / -1; }

    /* Type pill */
    .type-pill {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: rgba(20,20,20,0.7);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      backdrop-filter: blur(4px);
      flex-shrink: 0;
    }
    .type-pill.video { border-color: rgba(74,158,255,0.4); color: var(--accent); }

    .gradient-row { display: flex; gap: 8px; align-items: flex-end; }
    .gradient-row .field { flex: 1; }
    .gradient-swatch {
      width: 36px;
      height: 32px;
      border-radius: 5px;
      border: 1px solid var(--border);
      flex-shrink: 0;
      margin-bottom: 1px;
    }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 13px;
      border: 1px dashed var(--border);
      border-radius: 6px;
    }

    /* ── Error / info ── */
    .alert {
      padding: 0.9rem 1.25rem;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
    }
    .alert-error { background: rgba(224,85,85,0.1); border: 1px solid rgba(224,85,85,0.25); color: #e09090; }
    .alert-info  { background: rgba(74,158,255,0.08); border: 1px solid rgba(74,158,255,0.2); color: #90b8e0; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--success);
      color: #fff;
      padding: 9px 16px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="header">
  <div style="display:flex;align-items:center;">
    <h1>Portfolio Admin</h1>
    <span class="header-sub">projects.json editor</span>
  </div>
  <div class="header-actions">
    <label class="btn btn-sm" style="cursor:pointer;" title="Load a projects.json file from your computer">
      Load file
      <input type="file" accept=".json" id="fileInput" style="display:none">
    </label>
    <button class="btn btn-primary btn-sm" id="exportBtn">Export projects.json</button>
  </div>
</div>

<div class="main" id="main">
  <div style="color:var(--muted);text-align:center;padding:3rem;font-size:13px;">Loading projects.json…</div>
</div>

<script>
  // ── State ───────────────────────────────────────────────────────────────────
  let data = { reelUrl: '', threed: [], design: [] };

  // ── Utilities ───────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }

  // ── Load ────────────────────────────────────────────────────────────────────
  async function loadFromServer() {
    try {
      const res = await fetch('projects.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      data = await res.json();
      render();
    } catch {
      showLoadError();
    }
  }

  function showLoadError() {
    document.getElementById('main').innerHTML = `
      <div class="alert alert-error">
        Could not load <strong>projects.json</strong> automatically — this page must be opened via the local web server, not as a file.<br><br>
        Use the <strong>Load file</strong> button in the top right to load it manually from your computer.
      </div>`;
  }

  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        data = JSON.parse(ev.target.result);
        render();
        toast('File loaded');
      } catch {
        alert('Could not parse JSON — check the file for errors.');
      }
    };
    reader.readAsText(file);
  });

  // ── Export ──────────────────────────────────────────────────────────────────
  document.getElementById('exportBtn').addEventListener('click', () => {
    const out = collectAll();
    const json = JSON.stringify(out, null, 2);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    a.download = 'projects.json';
    a.click();
    toast('Exported projects.json');
  });

  // ── Collect from DOM ────────────────────────────────────────────────────────
  function collectAll() {
    return {
      reelUrl: document.getElementById('reelUrl')?.value.trim() ?? '',
      threed:  collectSection('threed'),
      design:  collectSection('design'),
    };
  }

  function collectSection(key) {
    const cards = document.querySelectorAll(`[data-section="${key}"] .project-card`);
    return Array.from(cards).map(card => {
      const type = card.querySelector('[data-field="type"]').value;
      const obj  = {
        title:    card.querySelector('[data-field="title"]').value.trim(),
        category: card.querySelector('[data-field="category"]').value.trim(),
        type,
        gradient: card.querySelector('[data-field="gradient"]').value.trim(),
      };
      if (type === 'image') {
        obj.src = card.querySelector('[data-field="src"]').value.trim();
      } else {
        obj.embedUrl  = card.querySelector('[data-field="embedUrl"]').value.trim();
        obj.thumbnail = card.querySelector('[data-field="thumbnail"]').value.trim();
      }
      return obj;
    });
  }

  // ── Render ──────────────────────────────────────────────────────────────────
  function render() {
    const main = document.getElementById('main');
    main.innerHTML = '';
    main.appendChild(renderReelSection());
    main.appendChild(renderSection('threed', '3D Work', data.threed ?? []));
    main.appendChild(renderSection('design', 'Design Work', data.design ?? []));
  }

  function renderReelSection() {
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `
      <div class="section-header">
        <span class="section-title">Demo Reel</span>
      </div>
      <div class="section-body">
        <div class="field">
          <label>Embed URL</label>
          <input id="reelUrl" type="text" value="${esc(data.reelUrl)}" placeholder="https://framerate.tv/embed/..." />
        </div>
        <div class="alert alert-info" style="font-size:12px;">Use the <strong>/embed/</strong> URL from framerate.tv, not the /watch/ URL.</div>
      </div>`;
    return sec;
  }

  function renderSection(key, title, projects) {
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.dataset.section = key;

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'section-header';

    const titleEl = document.createElement('span');
    titleEl.className = 'section-title';
    titleEl.innerHTML = `${title} <span class="count-badge" id="count-${key}">${projects.length} items</span>`;

    const addBtn = document.createElement('button');
    addBtn.className = 'btn btn-sm';
    addBtn.textContent = '+ Add Project';
    addBtn.addEventListener('click', () => addProject(key, projects));

    hdr.appendChild(titleEl);
    hdr.appendChild(addBtn);
    sec.appendChild(hdr);

    // Body
    const body = document.createElement('div');
    body.className = 'project-list';
    body.id = `list-${key}`;
    sec.appendChild(body);

    renderList(key, projects, body);
    return sec;
  }

  function renderList(key, projects, body) {
    body.innerHTML = '';
    if (projects.length === 0) {
      body.style.display = 'block';
      body.style.padding = '1.25rem';
      body.innerHTML = '<div class="empty">No projects yet — click + Add Project to get started.</div>';
    } else {
      body.style.display = '';
      body.style.padding = '';
      projects.forEach((p, i) => body.appendChild(makeCard(p, i, key, projects)));
    }
    const counter = document.getElementById(`count-${key}`);
    if (counter) counter.textContent = `${projects.length} items`;
  }

  function refreshList(key, projects) {
    const body = document.getElementById(`list-${key}`);
    if (body) renderList(key, projects, body);
  }

  // ── Project card ────────────────────────────────────────────────────────────
  function makeCard(p, index, key, projects) {
    const card = document.createElement('div');
    card.className = 'project-card';

    const isVideo = p.type === 'video';
    const bgImage = isVideo ? (p.thumbnail || '') : (p.src || '');
    const bgStyle = bgImage
      ? `background-image:url('${esc(bgImage)}');background-size:cover;background-position:center;`
      : `background:linear-gradient(${esc(p.gradient || '135deg,#1a1a1a,#2a2a2a')});`;
    const gradBg  = `background:linear-gradient(${esc(p.gradient || '135deg,#1a1a1a,#2a2a2a')})`;

    card.innerHTML = `
      <div class="card-thumb" style="${bgStyle}">
        <span class="card-thumb-tag type-pill ${isVideo ? 'video' : ''}">${isVideo ? 'Video' : 'Image'}</span>
        <div class="card-thumb-actions">
          <button class="btn btn-icon btn-ghost" data-action="up"   title="Move up">↑</button>
          <button class="btn btn-icon btn-ghost" data-action="down" title="Move down">↓</button>
          <button class="btn btn-icon btn-danger-ghost" data-action="del" title="Delete">✕</button>
        </div>
      </div>
      <div class="card-caption">
        <span class="card-name">${esc(p.title || 'Untitled')}</span>
        <button class="btn btn-sm btn-ghost" data-action="edit">Edit</button>
      </div>
      <div class="card-edit">
        <div class="card-edit-header">
          <span class="card-name">${esc(p.title || 'Untitled')}</span>
          <button class="btn btn-sm btn-ghost" data-action="done">Done</button>
        </div>
        <div class="card-edit-body">
          <div class="field">
            <label>Title</label>
            <input data-field="title" type="text" value="${esc(p.title || '')}" placeholder="Project title" />
          </div>
          <div class="field">
            <label>Category</label>
            <input data-field="category" type="text" value="${esc(p.category || '')}" placeholder="e.g. 3D, Brand Identity" />
          </div>
          <div class="field">
            <label>Type</label>
            <select data-field="type">
              <option value="image" ${!isVideo ? 'selected' : ''}>Image</option>
              <option value="video" ${isVideo ? 'selected' : ''}>Video</option>
            </select>
          </div>
          <div class="field full gradient-row">
            <div class="field" style="flex:1">
              <label>Gradient (placeholder)</label>
              <input data-field="gradient" type="text" value="${esc(p.gradient || '')}" placeholder="135deg, #1a1e2a, #1a2640" />
            </div>
            <div class="gradient-swatch" data-swatch style="${gradBg}"></div>
          </div>
          <div class="field full" data-image-block style="display:${isVideo ? 'none' : 'flex'};flex-direction:column;gap:4px;">
            <label>Image Path</label>
            <input data-field="src" type="text" value="${esc(p.src || '')}" placeholder="images/3d/filename.jpg" />
          </div>
          <div class="field full" data-video-block-1 style="display:${isVideo ? 'flex' : 'none'};flex-direction:column;gap:4px;">
            <label>Embed URL</label>
            <input data-field="embedUrl" type="text" value="${esc(p.embedUrl || '')}" placeholder="https://framerate.tv/embed/..." />
          </div>
          <div class="field full" data-video-block-2 style="display:${isVideo ? 'flex' : 'none'};flex-direction:column;gap:4px;">
            <label>Thumbnail Path</label>
            <input data-field="thumbnail" type="text" value="${esc(p.thumbnail || '')}" placeholder="images/thumbnails/filename.jpg" />
          </div>
        </div>
      </div>`;

    // ── References ──
    const thumb         = card.querySelector('.card-thumb');
    const titleInput    = card.querySelector('[data-field="title"]');
    const gradientInput = card.querySelector('[data-field="gradient"]');
    const typeSelect    = card.querySelector('[data-field="type"]');
    const srcInput      = card.querySelector('[data-field="src"]');
    const thumbInput    = card.querySelector('[data-field="thumbnail"]');
    const swatch        = card.querySelector('[data-swatch]');
    const typePill      = card.querySelector('.card-thumb-tag');
    const cardNames     = card.querySelectorAll('.card-name');

    // ── Edit toggle ──
    card.querySelector('[data-action="edit"]').addEventListener('click', () => {
      card.classList.add('editing');
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
    card.querySelector('[data-action="done"]').addEventListener('click', () => {
      card.classList.remove('editing');
    });

    // ── Live updates ──
    titleInput.addEventListener('input', () => {
      cardNames.forEach(el => el.textContent = titleInput.value || 'Untitled');
    });

    gradientInput.addEventListener('input', () => {
      swatch.style.background = `linear-gradient(${gradientInput.value})`;
      if (!srcInput.value && !thumbInput?.value) {
        thumb.style.backgroundImage = '';
        thumb.style.background = `linear-gradient(${gradientInput.value})`;
      }
    });

    function updateThumbPreview() {
      const url = typeSelect.value === 'video' ? thumbInput?.value : srcInput?.value;
      if (url) {
        thumb.style.background = '';
        thumb.style.backgroundImage = `url('${url}')`;
        thumb.style.backgroundSize = 'cover';
        thumb.style.backgroundPosition = 'center';
      } else {
        thumb.style.backgroundImage = '';
        thumb.style.background = `linear-gradient(${gradientInput.value})`;
      }
    }

    srcInput?.addEventListener('input', updateThumbPreview);
    thumbInput?.addEventListener('input', updateThumbPreview);

    typeSelect.addEventListener('change', () => {
      const vid = typeSelect.value === 'video';
      card.querySelector('[data-image-block]').style.display   = vid ? 'none' : 'flex';
      card.querySelector('[data-video-block-1]').style.display = vid ? 'flex' : 'none';
      card.querySelector('[data-video-block-2]').style.display = vid ? 'flex' : 'none';
      typePill.textContent = vid ? 'Video' : 'Image';
      typePill.classList.toggle('video', vid);
      updateThumbPreview();
    });

    // ── Reorder / Delete ──
    card.querySelector('[data-action="up"]').addEventListener('click', e => {
      e.stopPropagation();
      if (index === 0) return;
      const current = collectSection(key);
      [current[index - 1], current[index]] = [current[index], current[index - 1]];
      syncArray(projects, current);
      refreshList(key, projects);
    });

    card.querySelector('[data-action="down"]').addEventListener('click', e => {
      e.stopPropagation();
      if (index === projects.length - 1) return;
      const current = collectSection(key);
      [current[index], current[index + 1]] = [current[index + 1], current[index]];
      syncArray(projects, current);
      refreshList(key, projects);
    });

    card.querySelector('[data-action="del"]').addEventListener('click', e => {
      e.stopPropagation();
      const name = titleInput.value || 'this project';
      if (!confirm(`Delete "${name}"?`)) return;
      const current = collectSection(key);
      current.splice(index, 1);
      syncArray(projects, current);
      refreshList(key, projects);
    });

    return card;
  }

  function addProject(key, projects) {
    const current = collectSection(key);
    current.push({
      title:    'New Project',
      category: key === 'design' ? 'Brand Identity' : '3D',
      type:     'image',
      src:      '',
      gradient: '135deg, #1a1e2a, #2e1e3a',
    });
    syncArray(projects, current);
    refreshList(key, projects);
    // Scroll new card into view
    setTimeout(() => {
      const cards = document.querySelectorAll(`[data-section="${key}"] .project-card`);
      cards[cards.length - 1]?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  }

  function syncArray(target, source) {
    target.length = 0;
    source.forEach(p => target.push(p));
  }

  // ── Init ────────────────────────────────────────────────────────────────────
  loadFromServer();
</script>
</body>
</html>
