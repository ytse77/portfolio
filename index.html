<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1a1a1a;
      --surface:   #212121;
      --border:    #2e2e2e;
      --text:      #ececec;
      --muted:     #737373;
      --accent:    #e8e8e8;
      --glow:      rgba(255,255,255,0.06);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      overflow: hidden;
    }

    /* ── Noise grain overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 100;
    }

    /* ── Ambient gradient orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 520px; height: 520px;
      background: radial-gradient(circle, rgba(180,180,200,0.07) 0%, transparent 70%);
      top: -160px; left: -160px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(160,170,200,0.05) 0%, transparent 70%);
      bottom: -120px; right: -80px;
      animation-delay: -9s;
    }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.08); }
    }

    /* ── Grid lines ── */
    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 64px 64px;
      opacity: 0.35;
      pointer-events: none;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
    }

    /* ── Layout ── */
    .stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 2rem;
      gap: 0;
    }

    /* ── Eyebrow tag ── */
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 2.4rem;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.7s ease forwards 0.2s;
    }
    .eyebrow-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    /* ── Main headline ── */
    .headline {
      font-size: clamp(3.2rem, 10vw, 8.5rem);
      line-height: 0.92;
      letter-spacing: -0.04em;
      text-align: center;
      color: var(--accent);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s ease forwards 0.4s;
    }
    .headline span {
      display: block;
      color: var(--muted);
    }

    /* ── Divider ── */
    .divider {
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, transparent, var(--border), transparent);
      margin: 2.4rem 0;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.65s;
    }

    /* ── Sub-copy ── */
    .sub {
      font-size: clamp(0.75rem, 1.5vw, 0.9rem);
      letter-spacing: 0.06em;
      color: var(--muted);
      text-align: center;
      max-width: 360px;
      line-height: 1.7;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.7s ease forwards 0.8s;
    }

    /* ── Corner label ── */
    .corner {
      position: fixed;
      bottom: 2rem;
      width: 100%;
      text-align: center;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #404040;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 1.3s;
    }

    /* ── Floating markers (decorative) ── */
    .marker {
      position: fixed;
      font-size: 0.55rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #333;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 1.5s;
    }
    .marker-tl { top: 2rem; left: 2rem; }
    .marker-tr { top: 2rem; right: 2rem; }

    /* ── Shared animation ── */
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }


  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="grid"></div>

  <span class="marker marker-tl">Portfolio &#x2F;&#x2F; 2026</span>
  <span class="marker marker-tr">Design &amp; 3D</span>

  <main class="stage">

    <div class="eyebrow">
      <span class="eyebrow-dot"></span>
      Something is being crafted
    </div>

    <h1 class="headline">
      Coming<br><span>Soon.</span>
    </h1>

    <div class="divider"></div>

    <p class="sub">
      A new portfolio of graphic design &amp; 3D work is on the way.
    </p>

  </main>

  <p class="corner">&#169; 2026 &mdash; All rights reserved</p>



</body>
</html>
